server {
    listen 80;
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/v1/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }
    location /api/v1/image/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }
}
